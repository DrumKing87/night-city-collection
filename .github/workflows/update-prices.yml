name: Cyberpunk TCG Marktpreise aktualisieren

on:
  schedule:
    # Ein offizieller Cardmarket-Tagesexport statt acht PokéWallet-API-Blöcken.
    # 03:40 UTC: Cardmarket-Preisdatei sollte bereits aktualisiert sein.
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-city-price-updates
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Alle 458 Kartendrucke mit Cardmarket abgleichen
        run: python scripts/update_prices.py
      - name: Preise und Diagnose sicher veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json data/cardmarket-diagnostics.json
          if git diff --cached --quiet; then
            echo 'Keine Änderungen.'
            exit 0
          fi
          git commit -m 'Update all Cyberpunk Cardmarket prices [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'Cardmarket-Preisfeed erfolgreich veröffentlicht.'
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'GitHub-Push nach 5 Versuchen fehlgeschlagen.' >&2
              exit 1
            fi
            sleep $((attempt * 8))
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase-Konflikt: Keine bestehenden Dateien überschrieben.' >&2
              exit 1
            fi
          done
