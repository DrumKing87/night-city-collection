name: Alle Cyberpunk-Artworks prüfen (458 Kartendrucke)

on:
  workflow_dispatch:
  schedule:
    # Täglich prüfen, ob neue / wieder erreichbare Bilder verfügbar sind.
    - cron: '43 4 * * *'

permissions:
  contents: write

concurrency:
  group: night-city-artwork-update
  cancel-in-progress: false

jobs:
  artworks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bildformat-Prüfung installieren
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'

      - name: Alle 458 Kartenbilder prüfen und fehlende ergänzen
        run: python scripts/fetch_artworks.py --workers 8

      - name: Artworks und Statusbericht veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/cards data/artwork-manifest.json data/artwork-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update 458 card artworks and coverage report [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Keine Änderungen an Artwork-Dateien.'
          fi
